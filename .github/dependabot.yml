# Dependabot keeps cargo, GitHub Actions and the VS Code extension's npm deps current.
#
# Monthly, and grouped: minor/patch updates for each ecosystem arrive as one
# PR a month instead of a PR per package, so the PR tab stays readable. Majors
# still come as separate PRs because they tend to need code changes. Patch-level
# PRs merge themselves once CI is green (.github/workflows/dependabot-automerge.yml).
# Actions are pinned by SHA in workflows (see ci.yml), so dependabot rewrites the
# SHA + version comment together when it opens a PR.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The VS Code extension's npm subtree was on security-alert life-support
  # (only cargo + actions were scheduled). Keep it patched on the same cadence.
  - package-ecosystem: "npm"
    directory: "/editor/vscode"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "vscode"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
